<header>
  <div class="nav-container">
    <!-- Логотип / Название -->
    <a href="index.html" class="brand-title">ROBO-LAB</a>

    <!-- Кнопка гамбургера (видна только на телефонах) -->
    <button class="mobile-toggle" id="mobileToggle" aria-label="Открыть меню">
      <i class="fa-solid fa-bars" id="menuIcon"></i>
    </button>

    <!-- Навигационные ссылки -->
    <nav class="nav-links" id="navLinks">
      <a href="index.html#about" class="nav-link">О педагоге</a>
      <a href="index.html#directions" class="nav-link">Направления</a>
      <a href="projects.html" class="nav-link">Проекты</a>
      <a href="gallery.html" class="nav-link">Галерея</a>
      <a href="results.html" class="nav-link">Результаты</a>
    </nav>
  </div>
</header>

<style>
  /* --- Основные стили Шапки --- */
  header {
    background: rgba(5, 8, 17, 0.95);
    backdrop-filter: blur(12px);
    position: sticky;
    top: 0;
    z-index: 1000;
    border-bottom: 1px solid rgba(0, 243, 255, 0.25);
    padding: 1rem 2rem;
  }

  .nav-container {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .brand-title {
    font-family: 'Orbitron', sans-serif;
    color: #fff;
    font-size: 1.4rem;
    font-weight: 700;
    text-decoration: none;
    letter-spacing: 1px;
  }

  .nav-links {
    display: flex;
    gap: 1.5rem;
    align-items: center;
  }

  .nav-link {
    color: #00f3ff;
    text-decoration: none;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 6px;
    transition: all 0.3s ease;
  }

  .nav-link:hover {
    background: rgba(0, 243, 255, 0.15);
    color: #fff;
    box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
  }

  /* Иконка-гамбургер (скрыта на больших экранах) */
  .mobile-toggle {
    display: none;
    background: transparent;
    border: 1px solid rgba(0, 243, 255, 0.3);
    color: #00f3ff;
    font-size: 1.5rem;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.3s;
  }

  /* --- Адаптив для смартфонов (до 768px) --- */
  @media (max-width: 768px) {
    .mobile-toggle {
      display: block; /* Показываем кнопку меню */
    }

    .nav-links {
      display: none; /* Скрываем стандартное меню */
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      background: rgba(5, 8, 17, 0.98);
      backdrop-filter: blur(15px);
      flex-direction: column;
      padding: 1.5rem;
      gap: 1rem;
      border-bottom: 1px solid rgba(0, 243, 255, 0.25);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
    }

    /* Класс, который добавляется скриптом при клике */
    .nav-links.active {
      display: flex;
    }

    .nav-link {
      width: 100%;
      text-align: center;
      font-size: 1.1rem;
      padding: 10px 0;
    }
  }
</style>

<!-- Скрипт переключения мобильного меню -->
<script>
  const mobileToggle = document.getElementById('mobileToggle');
  const navLinks = document.getElementById('navLinks');
  const menuIcon = document.getElementById('menuIcon');

  mobileToggle.addEventListener('click', () => {
    navLinks.classList.toggle('active');
    
    // Меняем иконку с "гамбургера" на "крестик" и обратно
    if (navLinks.classList.contains('active')) {
      menuIcon.classList.remove('fa-bars');
      menuIcon.classList.add('fa-xmark');
    } else {
      menuIcon.classList.remove('fa-xmark');
      menuIcon.classList.add('fa-bars');
    }
  });

  // Автоматически закрывать меню при клике на любую ссылку
  document.querySelectorAll('.nav-link').forEach(link => {
    link.addEventListener('click', () => {
      navLinks.classList.remove('active');
      menuIcon.classList.remove('fa-xmark');
      menuIcon.classList.add('fa-bars');
    });
  });
</script>
